[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radarcult"
version = "0.1.0"
description = "Radar de editais (Cultura, Direitos Humanos, Assistência Social, Fomento) com alertas de prazo no Telegram"
requires-python = ">=3.10"
dependencies = [
    "playwright",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# Fases seguintes (spec-003/004): descomente quando chegar a hora
# bot = ["python-telegram-bot"]

[tool.setuptools.packages.find]
include = ["radarcult*"]